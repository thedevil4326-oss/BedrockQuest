name: BedrockQuest Android ARM64 Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK and CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.31.6"

      - name: Build OpenXR loader
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          cmake -S vendor/openxr -B build-openxr \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=29 \
            -DBUILD_LOADER=ON \
            -DDYNAMIC_LOADER=ON \
            -DBUILD_API_LAYERS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_CONFORMANCE_TESTS=OFF
          cmake --build build-openxr --target openxr_loader --parallel 2
          mkdir -p vendor/openxr/lib/arm64-v8a
          find build-openxr -name 'libopenxr_loader.so' -exec cp {} vendor/openxr/lib/arm64-v8a/ \;
          test -f vendor/openxr/lib/arm64-v8a/libopenxr_loader.so

      - name: Configure BedrockQuest
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          cmake -S . -B build-quest -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=29 \
            -DMCBEDVR_OPENXR_DIR="$GITHUB_WORKSPACE/vendor/openxr" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build BedrockQuest
        run: cmake --build build-quest --parallel 2

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: BedrockQuest-Android-ARM64
          path: |
            dist/
            build-quest/**/*.so
          if-no-files-found: error
